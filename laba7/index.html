<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тест: Кто ты из Э-364?</title>
    <style>
        /* ========== БАЗОВЫЙ СБРОС И СТИЛИ ДЛЯ КОНТЕНТА ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ОСНОВНОЙ ФОН СТРАНИЦЫ — ПРОЗРАЧНЫЙ, ЧТОБЫ ВИДЕТЬ ЛЕТАЮЩИЙ СЛОЙ */
        body {
            background: transparent;
            min-height: 100vh;
            width: 100%;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            /* ТЕЛО НЕ ПРОКРУЧИВАЕТСЯ, ФИКСИРУЕМ КОНТЕЙНЕР ПО ЦЕНТРУ */
            overflow-x: hidden;
            overflow-y: auto;    /* Чтобы можно было скроллить при маленькой высоте */
            position: relative;
            z-index: 1;
        }

        /* ЦЕНТРАЛЬНЫЙ КАРД (КОНТЕЙНЕР ОПРОСА) — ДОЛЖЕН БЫТЬ ПОВЕРХ ФОНА */
        .quiz-container {
            position: relative;
            z-index: 20;
            max-width: 560px;
            width: 90%;
            margin: 40px auto;
            background: rgba(18, 18, 24, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 1px solid rgba(108, 99, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(108, 99, 255, 0.1);
            padding: 28px 32px 38px;
            transition: all 0.2s ease;
        }

        /* Адаптив */
        @media (max-width: 550px) {
            .quiz-container {
                padding: 20px 22px 30px;
                margin: 20px auto;
                width: 92%;
            }
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #b9b3ff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            text-align: center;
        }

        .progress-text {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            color: #8f8faa;
            margin-bottom: 12px;
            text-align: center;
        }

        .progress-bar-bg {
            background: #2c2c36;
            border-radius: 30px;
            height: 6px;
            width: 100%;
            margin: 16px 0 28px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #6c63ff, #a388ff);
            width: 0%;
            height: 100%;
            border-radius: 30px;
            transition: width 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.4;
            color: #f2f2f7;
            margin: 16px 0 32px;
            text-align: center;
            word-break: break-word;
        }

        /* КНОПКИ ОТВЕТОВ */
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .answer-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid #34344a;
            border-radius: 60px;
            padding: 12px 22px;
            text-decoration: none;
            color: #e2e2f0;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .answer-btn:before {
            content: "✦";
            font-size: 1.2rem;
            color: #6c63ff;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .answer-btn:hover {
            background: #2a2a3c;
            border-color: #6c63ff;
            transform: translateX(6px);
            color: white;
        }

        .answer-btn:hover:before {
            opacity: 1;
            transform: scale(1.1);
            color: #c2b5ff;
        }

        /* СТИЛИ РЕЗУЛЬТАТА */
        .result-card {
            text-align: center;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #ffd966, #ffb347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .winner-name {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 20px 0 15px;
            color: #c5bdff;
            text-shadow: 0 0 12px rgba(108, 99, 255, 0.5);
            letter-spacing: 2px;
            word-break: break-word;
        }

        .restart-link {
            display: inline-block;
            background: #6c63ff;
            color: white;
            border-radius: 60px;
            padding: 12px 32px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 28px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(108, 99, 255, 0.3);
        }

        .restart-link:hover {
            background: #534bdb;
            transform: scale(0.97);
        }

        /* ЛЁГКИЙ ДЕКОР ДЛЯ ТЕКСТА */
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #5a5a72;
            margin-top: 28px;
            border-top: 1px solid rgba(108, 99, 255, 0.2);
            padding-top: 18px;
        }
    </style>

    <!-- СТИЛИ ЛЕТАЮЩЕГО ФОНА (67, частицы, анимация) -->
    <style>
        /* ПОЛНЫЙ СБРОС ФОНА — НЕ МЕШАЕТ ОСНОВНОМУ КОНТЕНТУ */
        .flying-67-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* клики проходят сквозь фон */
            z-index: 5;
            overflow: hidden;
            filter: blur(1px);
            opacity: 1;
        }

        /* Стили летающих частиц */
        .flying-67 {
            position: absolute;
            font-weight: 800;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            will-change: transform;
            animation: floatSoft 8s ease-out forwards;
            text-rendering: optimizeLegibility;
            user-select: none;
        }

        /* Плавная анимация полёта — спокойная, без резких движений */
        @keyframes floatSoft {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.6) rotate(0deg);
                filter: blur(2px);
            }
            12% {
                opacity: 0.55;
                filter: blur(0.5px);
            }
            25% {
                opacity: 0.75;
                transform: translate(var(--dx, 35px), var(--dy, -45px)) scale(0.95) rotate(var(--rot, 5deg));
                filter: blur(0.3px);
            }
            55% {
                opacity: 0.7;
                transform: translate(var(--dx2, 75px), var(--dy2, -95px)) scale(1.02) rotate(calc(var(--rot, 5deg) * 0.8));
                filter: blur(0.2px);
            }
            85% {
                opacity: 0.45;
                transform: translate(var(--dxEnd, 130px), var(--dyEnd, -170px)) scale(0.85) rotate(calc(var(--rot, 5deg) * 1.2));
                filter: blur(0.8px);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dxEnd, 140px), var(--dyEnd, -210px)) scale(0.5) rotate(calc(var(--rot, 5deg) * 1.4));
                filter: blur(2px);
            }
        }

        /* Уменьшение движения — щадящий режим */
        @media (prefers-reduced-motion: reduce) {
            .flying-67 {
                animation-duration: 14s !important;
                opacity: 0.45 !important;
            }
            .flying-67-background {
                filter: blur(0.8px) !important;
            }
        }
    </style>
</head>
<body>

<!-- ЛЕТАЮЩИЙ ФОН С ЧИСЛОМ 67 (вставлен как отдельный слой) -->
<div class="flying-67-background" id="fly67bg"></div>

<!-- ОСНОВНОЙ КОНТЕЙНЕР ДЛЯ ТЕСТА — ТУТ ВСЯ ЛОГИКА ОПРОСНИКА -->
<div class="quiz-container" id="quizRoot">
    <!-- Динамическое содержимое будет вставлено скриптом (на основе данных Java-логики) -->
    <div id="dynamicContent">
        <div style="text-align:center; color:#aaa;">Загрузка теста...</div>
    </div>
    <div class="footer-note">Э-364 · определение аурного типа</div>
</div>

<script>
    // ======================== КЛЮЧЕВЫЕ ДАННЫЕ ТЕСТА (ПОЛНОСТЬЮ СОВПАДАЮТ С JAVA) ========================
    // Массив вопросов: [текст вопроса, вариант1, метка1, вариант2, метка2, вариант3, метка3]
    const QUESTIONS_DATA = [
        ["Твоя любимая еда?",
            "Сыр", "Мышь",
            "Курица", "Кот",
            "Дошик", "Студент"],
        ["Тебе задали домашнее задание, что ты сделаешь?",
            "Буду балдеть", "Студент",
            "Сделаю через ИИ", "Мышь",
            "У меня лапки", "Кот"],
        ["Как ты добираешься до своего любимого лучшего в мире учебного заведения?",
            "На 98 любимом", "Студент",
            "На воздушном шаре", "Мышь",
            "На велосипеде", "Кот"],
        ["Сколько пар отсидишь?",
            "4 пары, не прийду(многа)", "Студент",
            "Заболел", "Мышь",
            "4 пары, отсижу 2", "Кот"],
        ["Что ты делаешь после пар?",
            "Смотрю тик ток", "Ярик артеллерийский заряд",
            "Иду хавать", "Мышь",
            "Иду домой", "Кот"],
        ["Насколько ты кент?",
            "Кирюха кент", "Кирюха кент",
            "Скинь лабу пж", "Мышь",
            "Спасибо большое огромное", "Кот"],
        ["Как ты здороваешься с преподавателем?",
            "Здороваюсь за руку", "Студент",
            "Говорю привет", "Мышь",
            "Салам алекуме", "Кот"],
        ["Сколько?",
            "67", "Студент",
            "42", "Мышь",
            "0", "Кот"]
    ];

    // Возможные итоговые персонажи (категории)
    const TOTAL_CHARACTERS = ["Студент", "Мышь", "Кот", "Кирюха кент"]; // добавим "Кирюха кент" из пятого вопроса (особый)
    // Но в оригинальном scores: Элипод, Бибурат, Цикса — однако из ответов используются ключи: "Студент","Мышь","Кот","Кирюха кент","Ярик артеллерийский заряд"
    // Внимание: в scores изначально в Java были три значения, но в процессе ответы добавляют: scores.put(answer, ...)
    // На основе данных, которые реально встречаются: "Студент", "Мышь", "Кот", "Кирюха кент", "Ярик артеллерийский заряд"
    // Приведём к единой логике: подсчёт голосов по ключам, затем победитель (максимальное значение)
    // Для совместимости с оригинальными ответами (включая "Ярик артеллерийский заряд" и "Кирюха кент") указываем все возможные категории.

    // Текущее состояние
    let currentQIndex = 0;
    let scoresMap = new Map();

    // Функция сброса (аналог resetTest)
    function resetTest() {
        currentQIndex = 0;
        scoresMap.clear();
        // По умолчанию добавляем всех возможных кандидатов с нулевыми очками (чтобы избежать undefined)
        const allPossibleKeys = ["Студент", "Мышь", "Кот", "Кирюха кент", "Ярик артеллерийский заряд"];
        for (let key of allPossibleKeys) {
            scoresMap.set(key, 0);
        }
    }

    // Получить победителя на основе текущих очков (максимум)
    function getWinner() {
        let maxScore = -1;
        let winner = "Студент"; // fallback
        for (let [key, value] of scoresMap.entries()) {
            if (value > maxScore) {
                maxScore = value;
                winner = key;
            }
        }
        // Обработка специального случая: если победитель Ярик, то красивое отображение
        if (winner === "Ярик артеллерийский заряд") return "Ярик (артиллерийский заряд)";
        if (winner === "Кирюха кент") return "Кирюха-кент";
        return winner.charAt(0).toUpperCase() + winner.slice(1);
    }

    // Генерация HTML вопросов либо результатов (полная копия логики generateHTML, но с сохранением стилей)
    function renderPage() {
        const container = document.getElementById("dynamicContent");
        if (!container) return;

        let html = "";

        // Случай: вопросы ещё не закончились
        if (currentQIndex < QUESTIONS_DATA.length) {
            const q = QUESTIONS_DATA[currentQIndex];
            const questionText = q[0];
            const option1 = q[1];
            const opt1Key = q[2];
            const option2 = q[3];
            const opt2Key = q[4];
            const option3 = q[5];
            const opt3Key = q[6];

            // Процент заполнения
            const percent = (currentQIndex / QUESTIONS_DATA.length) * 100;

            html += `<h1>🧠 Кто ты из Э-364?</h1>`;
            html += `<div class="progress-text">ВОПРОС ${currentQIndex + 1} / ${QUESTIONS_DATA.length}</div>`;
            html += `<div class="progress-bar-bg"><div class="progress-fill" style="width: ${percent}%;"></div></div>`;
            html += `<div class="question-text">${escapeHtml(questionText)}</div>`;
            html += `<div class="answers-list">`;
            // Три кнопки с уникальными ключами (answer=ключ) – ссылки, которые обрабатываются через GET
            html += `<a href="#" data-answer="${escapeAttr(opt1Key)}" class="answer-btn">${escapeHtml(option1)}</a>`;
            html += `<a href="#" data-answer="${escapeAttr(opt2Key)}" class="answer-btn">${escapeHtml(option2)}</a>`;
            html += `<a href="#" data-answer="${escapeAttr(opt3Key)}" class="answer-btn">${escapeHtml(option3)}</a>`;
            html += `</div>`;
        }
        else {
            // РЕЗУЛЬТАТЫ ТЕСТА
            const winnerName = getWinner();
            html += `<div class="result-card">`;
            html += `<div class="result-title">✨ Твой дух ✨</div>`;
            html += `<div class="winner-name">${escapeHtml(winnerName)}</div>`;
            html += `<p style="color:#b9b9dd; font-size:1rem; margin-top: 8px;">Поздравляем! Именно твой вайб резонирует с группой Э-364.</p>`;
            html += `<a href="#" id="restartButton" class="restart-link">🔄 Пройти тест заново</a>`;
            html += `</div>`;
        }

        container.innerHTML = html;

        // Привязываем обработчики к динамическим кнопкам (если это режим вопросов)
        if (currentQIndex < QUESTIONS_DATA.length) {
            const btns = document.querySelectorAll(".answer-btn");
            btns.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.preventDefault();
                    const answerKey = btn.getAttribute("data-answer");
                    if (answerKey) {
                        // Увеличиваем счёт у соответствующего персонажа
                        const currentScore = scoresMap.get(answerKey) || 0;
                        scoresMap.set(answerKey, currentScore + 1);
                        // Переход к следующему вопросу
                        currentQIndex++;
                        // Перерисовываем страницу
                        renderPage();
                        // Обновим url (не обязательно), но просто синхронизируем
                        updateURLState();
                    }
                });
            });
        }

        // Обработчик кнопки перезапуска, если находимся на финальном экране
        const restartBtn = document.getElementById("restartButton");
        if (restartBtn) {
            restartBtn.addEventListener("click", (e) => {
                e.preventDefault();
                resetTest();
                renderPage();
                updateURLState();
            });
        }
    }

    // Вспомогательные функции для экранирования
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    function escapeAttr(str) {
        if (!str) return "";
        return str.replace(/[&"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#39;';
            return m;
        });
    }

    // Синхронизация с URL-параметрами (чтобы отражать текущий прогресс, но основные действия выполняются через JS)
    // Это необязательная функция, но она позволяет сохранить перезагрузку и history (по желанию)
    // Делаем так: при изменении вопроса или рестарте меняем параметр прогресса ?q=
    function updateURLState() {
        let newUrl;
        if (currentQIndex >= QUESTIONS_DATA.length) {
            newUrl = window.location.pathname + "?result=done";
        } else {
            newUrl = window.location.pathname + `?step=${currentQIndex}`;
        }
        window.history.replaceState({}, "", newUrl);
    }

    // Восстановление состояния из URL (если вдруг пользователь перезагрузил страницу)
    function restoreFromURL() {
        const params = new URLSearchParams(window.location.search);
        const stepParam = params.get("step");
        const resultParam = params.get("result");
        if (resultParam === "done") {
            // если видим завершённый результат, нужно проверить текущий индекс. Если индекс не последний - форсируем конец
            if (currentQIndex < QUESTIONS_DATA.length) {
                // произошла странная ситуация - перезагрузка на финише, но scores, вероятно, пустые. Лучше сбросить?
                // но для логичности: мы не сохраняли очки, поэтому мягко перезапустим?
                // Но чтобы данные не потерялись – при загрузке scoresMap изначально инициализирован нулями,
                // реальные очки могут быть утеряны, поэтому если result=done и при этом очки все нули — то возможно пользователь хочет финальный экран.
                // но лучше не форсировать, просто оставим как есть. Чтобы избежать пустого победителя -> покажем, но очки будут 0.
                // Что ж, пусть будет честно: показываем результат, но если нет ответов, победителем станет первый из списка.
            }
        } else if (stepParam !== null) {
            const step = parseInt(stepParam, 10);
            if (!isNaN(step) && step >= 0 && step <= QUESTIONS_DATA.length) {
                currentQIndex = step;
            }
        }
        // Дополнительно: scoresMap при загрузке страницы уже обнулён или инициализирован resetTest в начале.
        // Но если перезагрузка, нужно убедиться что scoresMap имеет правильные нули.
        // Вызывается resetTest перед рендером
    }

    // Инициализация: сброс состояния и отрисовка с учётом URL
    function initQuiz() {
        resetTest();
        // Попробуем восстановить индекс, если есть step в URL
        const params = new URLSearchParams(window.location.search);
        const stepParam = params.get("step");
        if (stepParam !== null) {
            const stepVal = parseInt(stepParam, 10);
            if (!isNaN(stepVal) && stepVal >= 0 && stepVal <= QUESTIONS_DATA.length) {
                currentQIndex = stepVal;
            }
        }
        // Важно: если на страницу зашли с результатом, но scores пустой, то визуально будет winner по нулям.
        renderPage();
    }

    // Запускаем опросник
    initQuiz();

    // =============== ЛЕТАЮЩИЙ ФОН 67 (КОД ИЗ ПРИМЕРА, ПОЛНОСТЬЮ АДАПТИРОВАН) ===============
    (function() {
        const container = document.getElementById('fly67bg');
        if (!container) return;

        function getSoftBackgroundColor() {
            const hue = 28 + Math.random() * 32;
            const saturation = 42 + Math.random() * 32;
            const lightness = 55 + Math.random() * 22;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        function createSoft67() {
            const el = document.createElement('div');
            el.className = 'flying-67';
            const r = Math.random();
            let text = '67';
            if (r < 0.12) text = 'Кирюха кент';
            else if (r < 0.2) text = 'Пасхалко';
            else text = '67';
            el.innerText = text;
            const size = 22 + Math.random() * 46;
            el.style.fontSize = size + 'px';
            el.style.fontWeight = '700';
            const softColor = getSoftBackgroundColor();
            el.style.color = softColor;
            el.style.textShadow = `0 0 5px rgba(0,0,0,0.2)`;
            el.style.left = Math.random() * 100 + '%';
            el.style.top = Math.random() * 100 + '%';
            const dxBase = (Math.random() - 0.5) * 260;
            const dyBase = -30 - Math.random() * 110;
            const dx2 = dxBase + (Math.random() - 0.5) * 140;
            const dy2 = dyBase - 30 - Math.random() * 90;
            const dxEnd = dx2 + (Math.random() - 0.5) * 160;
            const dyEnd = dy2 - 45 - Math.random() * 120;
            const rot = (Math.random() - 0.5) * 55;
            el.style.setProperty('--dx', dxBase + 'px');
            el.style.setProperty('--dy', dyBase + 'px');
            el.style.setProperty('--dx2', dx2 + 'px');
            el.style.setProperty('--dy2', dy2 + 'px');
            el.style.setProperty('--dxEnd', dxEnd + 'px');
            el.style.setProperty('--dyEnd', dyEnd + 'px');
            el.style.setProperty('--rot', rot + 'deg');
            const duration = 5.5 + Math.random() * 8.5;
            el.style.animationDuration = duration + 's';
            el.style.animationDelay = Math.random() * 12 + 's';
            container.appendChild(el);
            setTimeout(() => {
                if (el && el.parentNode) el.remove();
            }, (duration + 1) * 1000);
        }

        for (let i = 0; i < 35; i++) {
            setTimeout(() => createSoft67(), i * 90);
        }

        setInterval(() => {
            const activeCount = container.children.length;
            let toCreate = 0;
            if (activeCount < 24) toCreate = 2;
            else if (activeCount < 38) toCreate = 1;
            else if (activeCount > 70) toCreate = 0;
            else if (activeCount < 55 && Math.random() < 0.4) toCreate = 1;
            else toCreate = Math.random() < 0.25 ? 1 : 0;
            for (let i = 0; i < toCreate; i++) {
                setTimeout(() => createSoft67(), i * 50);
            }
            if (activeCount > 85) {
                const children = Array.from(container.children);
                for (let i = 0; i < 20 && i < children.length; i++) {
                    if (children[i] && children[i].parentNode) children[i].remove();
                }
            }
        }, 1100);

        let mouseThrottle = false;
        document.addEventListener('mousemove', (e) => {
            if (mouseThrottle) return;
            mouseThrottle = true;
            const mouseEl = document.createElement('div');
            mouseEl.className = 'flying-67';
            mouseEl.innerText = '67';
            const sz = 18 + Math.random() * 32;
            mouseEl.style.fontSize = sz + 'px';
            mouseEl.style.fontWeight = '600';
            mouseEl.style.color = `hsl(38, 55%, 65%)`;
            mouseEl.style.textShadow = `0 0 4px rgba(0,0,0,0.15)`;
            const xPercent = (e.clientX / window.innerWidth) * 100;
            const yPercent = (e.clientY / window.innerHeight) * 100;
            mouseEl.style.left = xPercent + '%';
            mouseEl.style.top = yPercent + '%';
            const dx = (Math.random() - 0.5) * 110;
            const dy = -15 - Math.random() * 65;
            mouseEl.style.setProperty('--dx', dx + 'px');
            mouseEl.style.setProperty('--dy', dy + 'px');
            mouseEl.style.setProperty('--dx2', (dx + (Math.random() - 0.5) * 90) + 'px');
            mouseEl.style.setProperty('--dy2', (dy - 18 - Math.random() * 55) + 'px');
            mouseEl.style.setProperty('--dxEnd', (dx + (Math.random() - 0.5) * 120) + 'px');
            mouseEl.style.setProperty('--dyEnd', (dy - 40 - Math.random() * 75) + 'px');
            mouseEl.style.setProperty('--rot', ((Math.random() - 0.5) * 40) + 'deg');
            mouseEl.style.animationDuration = 2.8 + Math.random() * 3.2 + 's';
            mouseEl.style.animationDelay = '0s';
            container.appendChild(mouseEl);
            setTimeout(() => { if(mouseEl.parentNode) mouseEl.remove(); }, 3800);
            setTimeout(() => { mouseThrottle = false; }, 50);
        });

        let touchThrottle = false;
        document.addEventListener('touchmove', (e) => {
            if (touchThrottle || !e.touches.length) return;
            touchThrottle = true;
            const touch = e.touches[0];
            const touchEl = document.createElement('div');
            touchEl.className = 'flying-67';
            touchEl.innerText = '67';
            touchEl.style.fontSize = (20 + Math.random() * 28) + 'px';
            touchEl.style.color = `hsl(42, 52%, 68%)`;
            touchEl.style.left = (touch.clientX / window.innerWidth) * 100 + '%';
            touchEl.style.top = (touch.clientY / window.innerHeight) * 100 + '%';
            const ddx = (Math.random() - 0.5) * 100;
            const ddy = -12 - Math.random() * 60;
            touchEl.style.setProperty('--dx', ddx + 'px');
            touchEl.style.setProperty('--dy', ddy + 'px');
            touchEl.style.setProperty('--dx2', (ddx + (Math.random() - 0.5) * 85) + 'px');
            touchEl.style.setProperty('--dy2', (ddy - 20 - Math.random() * 55) + 'px');
            touchEl.style.setProperty('--dxEnd', (ddx + (Math.random() - 0.5) * 110) + 'px');
            touchEl.style.setProperty('--dyEnd', (ddy - 45 - Math.random() * 70) + 'px');
            touchEl.style.animationDuration = 3 + Math.random() * 4 + 's';
            container.appendChild(touchEl);
            setTimeout(() => { if(touchEl.parentNode) touchEl.remove(); }, 3600);
            setTimeout(() => { touchThrottle = false; }, 80);
        }, { passive: true });

        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mediaQuery.matches) {
            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                .flying-67 { animation-duration: 14s !important; opacity: 0.45 !important; }
                .flying-67-background { filter: blur(0.8px) !important; }
            `;
            document.head.appendChild(styleSheet);
        }
    })();
</script>
</body>
</html>
